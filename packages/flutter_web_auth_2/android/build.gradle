group = 'com.linusu.flutter_web_auth_2'
version = '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// [로컬 수정] Built-in Kotlin 대응: kotlin-android(KGP)를 직접 적용하지 않음.
// builtInKotlin=false 인 동안에는 Flutter Gradle 플러그인이 KGP를 대신 적용하고,
// builtInKotlin=true 로 전환하면 AGP 내장 Kotlin으로 컴파일됨 (Flutter 플러그인 템플릿과 동일한 구성)
apply plugin: 'com.android.library'

android {
    compileSdk = 36

    if (project.android.hasProperty("namespace")) {
        namespace = 'com.linusu.flutter_web_auth_2'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation 'androidx.browser:browser:1.9.0'
        implementation 'androidx.activity:activity-ktx:1.10.1'
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}
