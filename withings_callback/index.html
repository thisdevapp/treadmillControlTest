<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Withings 연결</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, sans-serif; background: #f0f2f8; color: #222; }
    main { text-align: center; padding: 24px; }
    a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 10px;
        background: #3f51b5; color: #fff; text-decoration: none; font-weight: bold; }
    @media (prefers-color-scheme: dark) { body { background: #101012; color: #dadae2; } }
  </style>
</head>
<body>
  <main>
    <p id="msg">앱으로 돌아가는 중…</p>
    <a id="open" href="#">앱으로 돌아가기</a>
  </main>
  <script>
    // Withings OAuth 콜백 중계 페이지
    // Withings가 붙여 준 쿼리스트링(code, state 또는 error 등)을 그대로 앱 커스텀 스킴으로 넘김.
    // 앱의 콜백 스킴(sleepprototype://withings)과 반드시 일치해야 함.
    var target = 'sleepprototype://withings' + window.location.search;
    document.getElementById('open').href = target;
    if (!window.location.search) {
      document.getElementById('msg').textContent = '전달할 인증 정보가 없습니다.';
    }
    window.location.replace(target);
  </script>
</body>
</html>
